<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SusuBook - Your Susu Properly Recorded</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SusuBook" />
    <meta name="application-name" content="SusuBook" />
    <meta name="description" content="SusuBook — Your susu properly recorded. Liberian Susu collection, roster management, offline financial ledger, and member SMS tracking." />
    
    <!-- Early PWA Install Prompt Capture Script -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (window.self !== window.top) return;
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] ServiceWorker registration notice:', err);
          });
        });
      }
    </script>
  </body>
</html>
